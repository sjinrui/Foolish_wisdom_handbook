tasks.named('check').configure {
    dependsOn tasks.named('logicTest')
    dependsOn tasks.named('bookLogicTest')
    dependsOn tasks.named('biomeTreatProgressTest')
    dependsOn tasks.named('travelerBiomeCatalogTest')
    dependsOn tasks.named('collectionDisplayModeTest')
    dependsOn tasks.named('collectionEntryTest')
    dependsOn tasks.named('catFoxCollectionScannerTest')
    dependsOn tasks.named('serverCollectionSnapshotTest')
    dependsOn tasks.named('foodWisdomKeyMappingsTest')
    dependsOn tasks.named('namingTest')
    dependsOn tasks.named('serverCollectionSnapshotStoreTest')
    dependsOn tasks.named('serverSnapshotPacketTest')
    dependsOn tasks.named('searchMatcherTest')
    dependsOn tasks.named('foodWisdomScreenLayoutTest')
    dependsOn tasks.named('displayedChapterCacheTest')
    dependsOn tasks.named('serverSnapshotCandidateCacheTest')
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}
